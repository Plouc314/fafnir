[project]
name = "fafnir-store"
version = "0.1.0"
description = "A small CLI that stores administrative documents in a git repo, encrypted end-to-end"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Goumaz", email = "alexandre.k.goumaz@gmail.com" }]
keywords = ["backup", "documents", "cli", "encryption", "age", "git"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
    "Environment :: Console",
    "Topic :: Security :: Cryptography",
    "Topic :: System :: Archiving :: Backup",
]
dependencies = [
    "pyrage>=1.3",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/Plouc314/fafnir"
Repository = "https://github.com/Plouc314/fafnir"

[project.scripts]
fafnir = "fafnir.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fafnir"]
